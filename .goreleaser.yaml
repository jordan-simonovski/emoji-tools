version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # Setting `files` replaces goreleaser's defaults, so the usual LICENSE/README/
  # CHANGELOG are listed again here. Anton is embedded in the binary and the OFL
  # requires its licence to travel with it.
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - src: internal/emoji/assets/Anton-OFL.txt
        dst: Anton-OFL.txt
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: emoji-tools
    repository:
      owner: jordan-simonovski
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/jordan-simonovski/emoji-tools"
    description: "Turn logos into Slack emojis: grids, scrolls, intensify, yells-at, uwu"
    license: "Apache-2.0"
    # The binary is unsigned; strip the quarantine flag on install so macOS
    # Gatekeeper doesn't block it ("Apple could not verify ...").
    # custom_block, not hooks: goreleaser's hooks emit `postflight`, which Homebrew deprecated.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/emoji-tools"], must_succeed: false
        end
      end
